name: Desktop

on:
  workflow_dispatch:
  push:
    branches: [main, "feat/**"]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Visual, accessibility, and Go gates
    runs-on: macos-26
    env:
      GOTOOLCHAIN: go1.25.12
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.12"
          cache-dependency-path: apps/desktop/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/desktop/frontend/package-lock.json

      - name: Install contract generator dependencies
        working-directory: .
        run: npm ci

      - name: Verify exact Go toolchain
        working-directory: .
        run: node scripts/check-desktop-go-version.mjs

      - name: Install frontend dependencies
        working-directory: apps/desktop/frontend
        run: npm ci

      - name: Frontend contracts and build
        working-directory: apps/desktop/frontend
        run: |
          npm run test
          npm run build
          npm audit --omit=optional

      - name: Install pinned Chromium
        working-directory: apps/desktop/frontend
        run: npx playwright install chromium

      - name: Visual and accessibility gates
        working-directory: apps/desktop/frontend
        run: |
          npm run test:visual
          npm run test:a11y

      - name: Desktop contract tests and drift
        working-directory: .
        run: |
          npm run test:desktop-contract
          npm run test:desktop-workflow
          npm run desktop:contract:check

      - name: Go tests and race gates
        run: |
          go test ./...
          go test -race ./internal/workspace ./internal/appprivate ./internal/appstate ./internal/ai ./internal/ai/workspaceid

      - name: Retain Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-playwright-diagnostics
          path: |
            apps/desktop/frontend/playwright-report/
            apps/desktop/frontend/test-results/
          if-no-files-found: ignore
          retention-days: 14

  package:
    name: Package / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    env:
      GOTOOLCHAIN: go1.25.12
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-26, windows-latest]
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.12"
          cache-dependency-path: apps/desktop/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/desktop/frontend/package-lock.json

      - name: Install contract generator dependencies
        working-directory: .
        run: npm ci

      - name: Verify exact Go toolchain and Desktop contract
        working-directory: .
        run: |
          node scripts/check-desktop-go-version.mjs
          npm run desktop:contract:check

      - name: Install Linux WebView prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential desktop-file-utils libgtk-3-dev libwebkit2gtk-4.1-dev xvfb

      - name: Install Windows packaging prerequisites
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install nsis --no-progress -y
          "C:\Program Files (x86)\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-alpha.78

      - name: Install frontend dependencies
        working-directory: apps/desktop/frontend
        run: npm ci

      - name: Initialize sanitized package diagnostics
        shell: bash
        run: |
          mkdir -p package-diagnostics
          printf 'os=%s\nphase=package-build\nresult=started\n' "$RUNNER_OS" > package-diagnostics/smoke-status.txt

      - name: Run native lifecycle and filesystem gates
        run: go test ./internal/integration ./internal/workspace ./internal/appprivate ./internal/appstate ./internal/ai/workspaceid

      - name: Generate bindings
        run: wails3 generate bindings -clean=true -ts

      - name: Verify generated bindings
        shell: bash
        # Wails alpha.78 emits trailing spaces in copied Go doc blank lines.
        # Ignore only end-of-line whitespace; API/model changes still fail.
        run: git diff --ignore-space-at-eol --exit-code -- frontend/bindings

      - name: Package native application
        run: wails3 package
        env:
          GIT_COMMITTER_NAME: GitHub Actions
          GIT_COMMITTER_EMAIL: actions@github.com

      - name: Verify packaged artifact
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Linux)
              test -n "$(find bin -maxdepth 1 -type f -name '*.deb' -print -quit)"
              test -n "$(find bin -maxdepth 1 -type f -name '*.rpm' -print -quit)"
              test -n "$(find bin -maxdepth 1 -type f -name '*.pkg.tar.zst' -print -quit)"
              ;;
            macOS)
              test -x bin/lumina-desktop.app/Contents/MacOS/lumina-desktop
              ;;
            Windows)
              test -n "$(find bin -maxdepth 1 -type f -name '*-installer.exe' -print -quit)"
              ;;
          esac

      - name: Install packaged application
        if: runner.os == 'Linux'
        shell: bash
        run: sudo dpkg -i "$(find bin -maxdepth 1 -type f -name '*.deb' -print -quit)"

      - name: Install packaged application
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = Resolve-Path (Get-ChildItem bin -Filter '*-installer.exe' | Select-Object -First 1).FullName
          $install = Start-Process -FilePath $installer.Path -ArgumentList '/S' -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Installer exited with code $($install.ExitCode)" }

      - name: Smoke launch packaged artifact
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p package-diagnostics
          printf 'os=%s\nphase=package-launch\nresult=started\n' "$RUNNER_OS" > package-diagnostics/smoke-status.txt
          clean_config="$(mktemp -d)"
          if [ "$RUNNER_OS" = "macOS" ]; then
            test ! -e "$HOME/Library/Application Support/lumina-wiki-desktop"
            install_root="$(mktemp -d)"
            mkdir -p "$install_root/Applications"
            cp -R bin/lumina-desktop.app "$install_root/Applications/Lumina Wiki.app"
            artifact="$install_root/Applications/Lumina Wiki.app/Contents/MacOS/lumina-desktop"
          else
            artifact="/usr/local/bin/lumina-desktop"
          fi
          test -n "$artifact"
          if [ "$RUNNER_OS" = "Linux" ]; then
            XDG_CONFIG_HOME="$clean_config" xvfb-run -a "$artifact" > "$RUNNER_TEMP/lumina-package-smoke.log" 2>&1 &
          else
            "$artifact" > "$RUNNER_TEMP/lumina-package-smoke.log" 2>&1 &
          fi
          artifact_pid=$!
          sleep 5
          if ! kill -0 "$artifact_pid"; then
            printf 'os=%s\nphase=package-launch\nresult=failed\n' "$RUNNER_OS" > package-diagnostics/smoke-status.txt
            exit 1
          fi
          kill "$artifact_pid"
          wait "$artifact_pid" || true
          rm -f "$RUNNER_TEMP/lumina-package-smoke.log"
          printf 'os=%s\nphase=package-launch\nresult=passed\n' "$RUNNER_OS" > package-diagnostics/smoke-status.txt

      - name: Smoke launch packaged artifact
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force package-diagnostics | Out-Null
          @("os=Windows", "phase=package-launch", "result=started") |
            Set-Content package-diagnostics/smoke-status.txt
          $artifact = Resolve-Path "$env:ProgramFiles\Lumina Wiki\Lumina Wiki\lumina-desktop.exe" -ErrorAction Stop
          $cleanConfig = Join-Path $env:RUNNER_TEMP "lumina-clean-config"
          New-Item -ItemType Directory -Force $cleanConfig | Out-Null
          $env:APPDATA = $cleanConfig
          $env:LOCALAPPDATA = $cleanConfig
          $stdout = Join-Path $env:RUNNER_TEMP "lumina-package-stdout.log"
          $stderr = Join-Path $env:RUNNER_TEMP "lumina-package-stderr.log"
          $process = Start-Process -FilePath $artifact.Path -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          Start-Sleep -Seconds 5
          if ($process.HasExited) {
            @("os=Windows", "phase=package-launch", "result=failed") |
              Set-Content package-diagnostics/smoke-status.txt
            throw "Packaged executable exited during smoke launch"
          }
          Stop-Process -Id $process.Id
          Remove-Item $stdout,$stderr -Force -ErrorAction SilentlyContinue
          @("os=Windows", "phase=package-launch", "result=passed") |
            Set-Content package-diagnostics/smoke-status.txt

      - name: Retain sanitized package failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lumina-desktop-package-diagnostics-${{ runner.os }}
          path: apps/desktop/package-diagnostics/
          if-no-files-found: error
          retention-days: 14

      - name: Retain native package
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: lumina-desktop-${{ runner.os }}
          path: apps/desktop/bin/
          if-no-files-found: error
          retention-days: 14
