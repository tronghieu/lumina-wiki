name: Desktop

on:
  workflow_dispatch:
  push:
    branches: [main, "feat/**"]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Visual, accessibility, and Go gates
    runs-on: macos-26
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache-dependency-path: apps/desktop/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: apps/desktop/frontend
        run: npm ci

      - name: Frontend contracts and build
        working-directory: apps/desktop/frontend
        run: |
          npm run test
          npm run build
          npm audit --omit=optional

      - name: Install pinned Chromium
        working-directory: apps/desktop/frontend
        run: npx playwright install chromium

      - name: Visual and accessibility gates
        working-directory: apps/desktop/frontend
        run: |
          npm run test:visual
          npm run test:a11y

      - name: Go tests and race gates
        run: |
          go test ./...
          go test -race ./internal/ai ./internal/ai/settings ./internal/ai/secrets ./internal/ai/history ./internal/ai/workspaceid ./internal/ai/providers ./internal/ai/retrieval ./internal/ai/index ./internal/ai/chat

      - name: Retain Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-playwright-diagnostics
          path: |
            apps/desktop/frontend/playwright-report/
            apps/desktop/frontend/test-results/
          if-no-files-found: ignore
          retention-days: 14

  package:
    name: Package / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-26, windows-latest]
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache-dependency-path: apps/desktop/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/frontend/package-lock.json

      - name: Install Linux WebView prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential libgtk-3-dev libwebkit2gtk-4.1-dev xvfb

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-alpha.78

      - name: Install frontend dependencies
        working-directory: apps/desktop/frontend
        run: npm ci

      - name: Generate bindings
        run: wails3 generate bindings -clean=true -ts

      - name: Verify generated bindings
        shell: bash
        # Wails alpha.78 emits trailing spaces in copied Go doc blank lines.
        # Ignore only end-of-line whitespace; API/model changes still fail.
        run: git diff --ignore-space-at-eol --exit-code -- frontend/bindings

      - name: Build native package
        run: wails3 build

      - name: Verify packaged artifact
        shell: bash
        run: test -n "$(find bin -maxdepth 3 -type f -print -quit)"

      - name: Smoke launch packaged artifact
        if: runner.os != 'Windows'
        shell: bash
        run: |
          artifact="$(find bin -maxdepth 3 -type f -perm -111 -print -quit)"
          test -n "$artifact"
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a "$artifact" > package-smoke.log 2>&1 &
          else
            "$artifact" > package-smoke.log 2>&1 &
          fi
          artifact_pid=$!
          sleep 5
          kill -0 "$artifact_pid"
          kill "$artifact_pid"
          wait "$artifact_pid" || true

      - name: Smoke launch packaged artifact
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $artifact = Get-ChildItem bin -Recurse -Filter *.exe | Select-Object -First 1
          if (-not $artifact) { throw "No packaged executable found" }
          $process = Start-Process -FilePath $artifact.FullName -PassThru
          Start-Sleep -Seconds 5
          if ($process.HasExited) { throw "Packaged executable exited during smoke launch" }
          Stop-Process -Id $process.Id

      - name: Retain native package
        uses: actions/upload-artifact@v4
        with:
          name: lumina-desktop-${{ runner.os }}
          path: apps/desktop/bin/
          if-no-files-found: error
          retention-days: 14
