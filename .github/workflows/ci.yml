name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  installability:
    name: Node ${{ matrix.node-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # Node 20 reached end-of-life in April 2026, and actions targeting its
        # runtime are deprecated on hosted runners, so the test matrix moved to
        # 24. Node 22 was skipped rather than passed through: it carried a
        # structured-clone IPC bug in the node:test runner (ERR_TEST_FAILURE /
        # "Unable to deserialize cloned data due to invalid or unsupported
        # version") that surfaced intermittently on every hosted OS and was why
        # this matrix sat on a single version at all. Both suites were run on
        # 24 locally before the switch with no sign of it.
        #
        # Deliberate gap: package.json still declares `engines: >=20.0.0`, so
        # Node 20 and 22 remain supported but are no longer exercised here. An
        # API available only in newer Node would break those users without
        # failing CI. Narrow `engines` if that trade stops being worth it.
        node-version: [24]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install Node dependencies
        run: npm ci

      - name: Install Python test dependencies
        run: python -m pip install -r src/tools/requirements.txt

      - name: Installer tests
        run: npm run test:installer

      - name: Script tests
        run: npm run test:scripts

      - name: Python tool tests
        run: npm run test:python

      - name: Catalog + doc-count integrity
        run: npm run test:catalog

      - name: CLI smoke
        run: node bin/lumina.js --version --no-update

      - name: Install idempotency
        run: npm run ci:idempotency

      # Cold-start is a property of Node module loading and is dominated by
      # filesystem latency. Windows hosted runners (D:\ network-backed) and
      # macOS runners measure 2-3x slower than Linux for the same code, so the
      # gate runs only on ubuntu-latest. Other OSes still exercise the CLI via
      # the smoke step above.
      - name: Cold-start budget
        if: runner.os == 'Linux'
        run: npm run ci:cold-start

      - name: Package readiness
        run: npm run ci:package

      - name: Agent-host isolation
        run: npm run ci:agent-isolation

      - name: End-to-end (librarian mode)
        run: npm run test:e2e

  bun-smoke:
    name: Bun smoke (ubuntu)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Node dependencies
        run: bun install

      - name: CLI version (cold-start under Bun)
        run: bun bin/lumina.js --version --no-update

      - name: End-to-end install under Bun
        run: bun run dev:sandbox -- --yes --packs core
