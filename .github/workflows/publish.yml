name: Publish npm

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    environment: npm-production

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Verify tag matches package version
        id: channel
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          test "${GITHUB_REF_NAME}" = "v${version}"

          # The npm dist-tag comes from the version's pre-release identifier:
          #   1.12.0        -> latest   (the default channel every user gets)
          #   1.12.0-next.0 -> next     (npx lumina-wiki@next)
          #   1.12.0-rc.1   -> rc
          # A pre-release publish must never move `latest`, so an identifier we
          # cannot read is a hard stop rather than a silent fallback.
          #
          # Build metadata is stripped first: it is not part of the pre-release,
          # yet it may itself contain a hyphen (1.2.3+build-next is a *stable*
          # release) or trail one (1.2.3-next+build).
          precedence="${version%%+*}"
          if [[ "$precedence" == *-* ]]; then
            channel="${precedence#*-}"
            channel="${channel%%.*}"
            # npm refuses any dist-tag that parses as a SemVer range, so "x" and
            # "v1" are caught here rather than after the gates have run.
            if [[ ! "$channel" =~ ^[a-z][a-z0-9-]*$ ]] \
              || [ "$channel" = "latest" ] \
              || [ "$channel" = "x" ] \
              || [[ "$channel" =~ ^v[0-9]+$ ]]; then
              echo "Refusing to publish ${version}: unusable pre-release channel '${channel}'." >&2
              exit 1
            fi
            echo "npm_tag=${channel}" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "npm_tag=latest" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Node dependencies
        run: npm ci

      - name: Installer tests
        run: npm run test:installer

      - name: Install idempotency
        run: npm run ci:idempotency

      - name: Package readiness
        run: npm run ci:package

      - name: Publish package
        # --provenance signs the tarball with the workflow's OIDC identity, so
        # npm can attest which repo, commit and run built it. Requires the
        # id-token: write permission granted above.
        run: npm publish --provenance --tag "${{ steps.channel.outputs.npm_tag }}"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ steps.channel.outputs.prerelease }}
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          flags=(--verify-tag --title "${GITHUB_REF_NAME}")
          if [ "$PRERELEASE" = "true" ]; then
            flags+=(--prerelease)
          fi
          notes="$(awk -v prefix="## [${version}]" '
            index($0, prefix) == 1 { flag = 1; next }
            /^## \[/ && flag { exit }
            flag { print }
          ' CHANGELOG.md)"
          notes="$(printf '%s\n' "$notes" | sed -e '/./,$!d')"
          if [ -n "$notes" ]; then
            printf '%s\n' "$notes" > release-notes.md
            gh release create "${GITHUB_REF_NAME}" "${flags[@]}" --notes-file release-notes.md
          else
            echo "No CHANGELOG entry for ${version}; falling back to generated notes."
            gh release create "${GITHUB_REF_NAME}" "${flags[@]}" --generate-notes
          fi

  verify:
    name: Verify the release is live
    needs: publish
    runs-on: ubuntu-latest

    # Deliberately a separate job from `publish`, not a final step inside it.
    # `npm publish` is one-shot: a published version is immutable, so a rerun
    # of the publish job fails at that step and never reaches verification.
    # Isolated here, a transient registry hiccup can be rerun on its own --
    # this job only reads.
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Verify
        # Re-derives the channel from package.json and asserts the tag reached
        # origin, the version reached npm, and the dist-tag actually moved.
        # Retries because a freshly published dist-tag can take a moment to
        # become visible on the registry.
        run: node scripts/release-verify.mjs --retries 6 --delay 5000
